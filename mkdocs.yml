site_name: Journey Profile Generator
site_description: Interactive train journey planning and JSON generation.
docs_dir: .  # Suche im Hauptverzeichnis nach .md Dateien
theme:
  name: material
  language: en
  icon:
    logo: material/train
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top  # "Nach oben"-Button
    - content.code.copy
    - search.suggest
    - search.highlight

nav:
  - Welcome: README.md
  - User Guide:
      - Getting Started: getting_started.md
      - Controls & Navigation: controls.md
      - Parameter Configuration: controlling.md
  - Developer Documentation:
      - Architecture Overview: DEVELOPMENT.md
      - Testing & Verification: testing/TESTING_PLAN.md
  - Data Formats:
      - Journey Profile JSON: data_examples/readme.txt

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - details
